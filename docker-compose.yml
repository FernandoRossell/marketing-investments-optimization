version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: retail_marketing_postgres
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: retail_marketing_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: retail_marketing_api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./:/app
    depends_on:
      - mlflow

volumes:
  postgres_data:
